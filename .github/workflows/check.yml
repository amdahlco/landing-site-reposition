# Runs both tools against the example site on every pull request and every push to main.
# Every action is pinned to a full commit; Dependabot proposes updates (see dependabot.yml).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Set up the tools (locked install)
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the example hero
        run: node tools/verify-hero.mjs --config=examples/acme/reposition.config.json

      - name: Measure a line on the example
        run: node tools/measure.mjs --config=examples/acme/reposition.config.json "A test line."
